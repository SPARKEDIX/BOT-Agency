<svg xmlns="http://www.w3.org/2000/svg" width="800" height="190" viewBox="0 0 800 190" role="img" aria-label="BOT-Agency animated banner">
  <defs>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6da7ec"/>
      <stop offset="0.5" stop-color="#f0efec"/>
      <stop offset="1" stop-color="#6da7ec"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0; 1 0; -1 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <rect width="800" height="190" rx="14" fill="#000000"/>
  <rect x="1" y="1" width="798" height="188" rx="13" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="2"/>
  <g fill="#6da7ec">
    <circle cx="90" cy="40" r="3" opacity="0.8">
      <animate attributeName="cy" values="40;70;40" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0.2;0.8" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="710" cy="140" r="4" opacity="0.6">
      <animate attributeName="cy" values="140;100;140" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="650" cy="45" r="2.5" opacity="0.7">
      <animate attributeName="cy" values="45;75;45" dur="3.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0.2;0.7" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="145" r="2.5" opacity="0.5">
      <animate attributeName="cy" values="145;115;145" dur="4.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.15;0.5" dur="4.6s" repeatCount="indefinite"/>
    </circle>
  </g>
  <text x="400" y="92" text-anchor="middle" font-family="system-ui, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="700" fill="url(#sweep)">BOT-Agency</text>
  <text x="400" y="126" text-anchor="middle" font-family="system-ui, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="17" fill="#c3c2b7">One boss model · 13 specialist agents · single NVIDIA key</text>
  <rect x="392" y="140" width="16" height="4" rx="2" fill="#6da7ec">
    <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>
